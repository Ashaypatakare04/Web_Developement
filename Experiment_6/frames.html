<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iFrame Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .info {
            font-weight: bold;
            font-style: italic;
            margin: 5px 0;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        hr {
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <div class="info">Name : Ashay Vitthal Patakare</div>
    <div class="info">Class : SY A (CSE) | Batch : S3</div>
    <div class="info">Roll No. : 56</div>

    <hr>

    <h1>HTML iFrame Example</h1>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/ZPdk5GaIDjo"
            title="YouTube video player" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/BsDoLVMnmZs"
            title="YouTube video player" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/cLp-tYE48wc"
            title="YouTube video player" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/JcIkWZUOWzA"
            title="YouTube video player" allowfullscreen></iframe>
    </div>

    <hr>

</body>
</html>
