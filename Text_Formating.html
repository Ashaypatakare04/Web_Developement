<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <h1 class="title">Hello World!</h1>
      <ul>
      <li><h2><b>This is bold text</b></h2></li>
      <li><h3><strong>This is strong text</strong></h3></li>
      <li><h2><i>This is italic text</i></h2></li>
      <li><h3><em>This is Emphasized text</em></h3></li>
      <li><h2><mark>This is mark text</mark></h2></li>
      <li><h2><small>This is small text</small></h2></li>
      <li><h2><del>This is deleted text</del></h2></li>
      <li><h2><ins>This is inserted text</ins></h2></li>
      <li><h2>This is <sub>Subscripted</sub>text</h2></li>
      <li><h2>This is <sup>Superscripted</sup>text</h2></li>
      </ul>
      <script src="script.js"></script>
  </body>
</html>
